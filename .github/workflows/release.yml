name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  application:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [linux-x64, linux-arm64, win-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet test --configuration Release --filter "TestCategory!=Parity"
      - run: >
          dotnet publish src/L4D2PlayStats.Hub.Web
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained
          --output publish
          -p:Version=${TAG#v}
      - if: startsWith(matrix.runtime, 'linux')
        run: tar -czf l4d2-playstats-hub-${{ matrix.runtime }}.tar.gz -C publish .
      - if: startsWith(matrix.runtime, 'win')
        run: cd publish && zip -qr ../l4d2-playstats-hub-${{ matrix.runtime }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.runtime }}
          path: l4d2-playstats-hub-${{ matrix.runtime }}.*

  plugins:
    runs-on: ubuntu-latest
    env:
      SOURCEMOD_BUILD: '1.12.0.7260'
      SOURCEMOD_PACKAGE: 'sourcemod-1.12.0-git7260-linux.tar.gz'
      SOURCEMOD_SHA256: 'b01719e6143bc7d5bb63aae8086d031574da6ef838f041ba4b8ab72c8c75b888'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Download SourceMod
        run: |
          mkdir -p "$RUNNER_TEMP/sourcemod"
          curl --fail --silent --show-error --location "https://github.com/alliedmodders/sourcemod/releases/download/${SOURCEMOD_BUILD}/${SOURCEMOD_PACKAGE}" --output "$RUNNER_TEMP/sourcemod.tar.gz"
          echo "${SOURCEMOD_SHA256}  $RUNNER_TEMP/sourcemod.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sourcemod.tar.gz" -C "$RUNNER_TEMP/sourcemod" addons/sourcemod/scripting
          chmod +x "$RUNNER_TEMP/sourcemod/addons/sourcemod/scripting/spcomp64"
          echo "SPCOMP=$RUNNER_TEMP/sourcemod/addons/sourcemod/scripting/spcomp64" >> "$GITHUB_ENV"
      - name: Check that the committed plugins match their sources
        run: bash plugins/build.sh --check
      - name: Package the plugins
        run: |
          cd plugins
          zip -qr ../l4d2-playstats-hub-plugins.zip left4dead2 README.md README.pt.md README.es.md LICENSE NOTICE.md
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: l4d2-playstats-hub-plugins.zip

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.TAG }}

  release:
    needs: [application, plugins]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: application-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: plugins
          path: artifacts
      - run: gh release create "${TAG}" artifacts/* --title "${TAG}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
