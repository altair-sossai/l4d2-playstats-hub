name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  application:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [linux-x64, linux-arm64, win-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet test --configuration Release --filter "TestCategory!=Parity"
      - run: >
          dotnet publish src/L4D2PlayStats.Hub.Web
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained
          --output publish
          -p:Version=${GITHUB_REF_NAME#v}
      - if: startsWith(matrix.runtime, 'linux')
        run: tar -czf l4d2-playstats-hub-${{ matrix.runtime }}.tar.gz -C publish .
      - if: startsWith(matrix.runtime, 'win')
        run: cd publish && zip -qr ../l4d2-playstats-hub-${{ matrix.runtime }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.runtime }}
          path: l4d2-playstats-hub-${{ matrix.runtime }}.*

  plugins:
    runs-on: ubuntu-latest
    env:
      SOURCEMOD_VERSION: '1.12'
    steps:
      - uses: actions/checkout@v4
      - name: Download SourceMod
        run: |
          mkdir -p "$RUNNER_TEMP/sourcemod"
          curl --fail --silent --show-error --location "https://www.sourcemod.net/latest.php?version=${SOURCEMOD_VERSION}&os=linux" --output "$RUNNER_TEMP/sourcemod.tar.gz"
          tar -xzf "$RUNNER_TEMP/sourcemod.tar.gz" -C "$RUNNER_TEMP/sourcemod" addons/sourcemod/scripting
          chmod +x "$RUNNER_TEMP/sourcemod/addons/sourcemod/scripting/spcomp64"
          echo "SPCOMP=$RUNNER_TEMP/sourcemod/addons/sourcemod/scripting/spcomp64" >> "$GITHUB_ENV"
      - run: bash plugins/build.sh
      - name: Package the plugins
        run: |
          mkdir -p package/addons/sourcemod/plugins package/addons/sourcemod/configs package/cfg
          cp plugins/compiled/*.smx package/addons/sourcemod/plugins/
          cp -r plugins/translations package/addons/sourcemod/translations
          cp plugins/configs/* package/addons/sourcemod/configs/
          cp plugins/cfg/playstats.cfg.example package/cfg/
          cp plugins/README.md plugins/LICENSE plugins/NOTICE.md package/
          cd package && zip -qr ../l4d2-playstats-hub-plugins.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: l4d2-playstats-hub-plugins.zip

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  release:
    needs: [application, plugins]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: gh release create "${GITHUB_REF_NAME}" artifacts/* --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
