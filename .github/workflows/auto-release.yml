name: Auto release

on:
  workflow_run:
    workflows: ['Build and test', 'Browser tests', 'Databases', 'Plugins']
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "${head}" != "${SHA}" ]; then
            echo "${SHA} is no longer the head of main, the newer commit will be released."
            exit 0
          fi
          if git tag --points-at "${SHA}" | grep -q '^v'; then
            echo "${SHA} is already released as $(git tag --points-at "${SHA}" | grep '^v' | head -n 1)."
            exit 0
          fi
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&event=push&per_page=100" --jq '[.workflow_runs[] | select(.name == "Build and test" or .name == "Browser tests" or .name == "Databases" or .name == "Plugins")]')"
          pending="$(echo "${runs}" | jq '[.[] | select(.status != "completed")] | length')"
          failed="$(echo "${runs}" | jq '[.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped")] | length')"
          if [ "${pending}" != "0" ]; then
            echo "Other checks of ${SHA} are still running; the last one to finish releases it."
            exit 0
          fi
          if [ "${failed}" != "0" ]; then
            echo "A check of ${SHA} did not pass, nothing is released."
            exit 0
          fi
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<< "${latest#v}"
          tag="v${major}.${minor}.$((patch + 1))"
          git tag "${tag}" "${SHA}"
          git push origin "${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Released ${SHA} as ${tag}."

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
