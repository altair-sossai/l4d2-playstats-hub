// =============================================================================
// L4D2 PlayStats Hub - settings of the five game server plugins
// =============================================================================
//
// This is the only file you edit. It is run by this line, which you add once
// at the end of cfg/server.cfg:
//
//     exec playstats.cfg
//
// The game runs server.cfg, and so this file, every time a map loads.
//
// When you copy a new version of the plugins, keep your copy of this file:
// it holds your token. Every other file of the plugins can be replaced.
//
// Each setting goes in one place only: here, or in a match mode with
// confogl_addcvar, never both. If a match mode already sets one of the
// settings below, delete it from this file, or the two values fight on every
// map change. Never use confogl_addcvar for playstats_url or playstats_token.
//
// Check the result in the server console with: sm_playstats_test
//
// =============================================================================
// PART 1 - REQUIRED: the address of the site and the token of this server
// =============================================================================
//
// On the site: Administration > Game servers > your server. The page shows
// two lines with your values, like the examples below. Copy them and paste
// them under this comment, as they are, without // in front.
//
// If you already pasted them into cfg/server.cfg, as the site page suggests,
// that works too: then leave this part empty, so this file does not replace
// them.
//
// Example (these lines are off; yours go below them):
//
// playstats_url "https://stats.example.com"
// playstats_token "my-server:3f9c0d6e5b2a4c1f8e7d6c5b4a3f2e1d"
//
// playstats_url   Address of the site, starting with https:// or http://,
//                 without a slash at the end. All five plugins use it.
// playstats_token Token of this game server, <identifier>:<key>. All five
//                 plugins use it. Keep it secret: anyone who has it can send
//                 matches as this server. Players cannot read it in game.

// Paste the two lines here:



// -----------------------------------------------------------------------------
// l4d2_playstats.smx (comes with L4D2 Competitive Rework) writes the
// statistics file of each map, which l4d2_playstats_sync.smx sends to the
// site. It writes nothing unless this is 1 (its default is 0). The ZoneMod
// match modes of Competitive Rework do not turn it on, so keep this line.
// If one of your match modes sets it with confogl_addcvar, delete this line.
// Values: 0 = off, 1 = write the files, 2 = also write readable tables.
// Until a match mode loads l4d2_playstats.smx, the console shows
// "Unknown command" for this line once per map; that is expected.
// -----------------------------------------------------------------------------
sm_stats_writestats "1"


// =============================================================================
// PART 2 - OPTIONAL: leave as they are unless you want to change something
// =============================================================================
//
// Every line below is turned off with // and shows the default value, which
// the plugin uses when the line stays off. To change a value, delete the //
// at the start of the line and edit the number or text.

// -----------------------------------------------------------------------------
// l4d2_ranking.smx - in-game ranking page (!ranking)
// -----------------------------------------------------------------------------

// Address the in-game browser opens. Empty means playstats_url. The browser of
// the game is from 2012 and often cannot open a modern HTTPS site: if the
// ranking panel stays blank, put a plain http:// address of the same site here.
// playstats_ingame_url ""

// 1 = open the ranking page for players who join before a match starts, and
// on !ranking. 0 = never open it.
// ranking_show_motd_panel "1"

// -----------------------------------------------------------------------------
// l4d2_show_patent_icon.smx - patent icon above each player before a match
// -----------------------------------------------------------------------------

// Version in the names of the sprite files players download:
// materials/sprites/patent_<level>_v<version>.vmt and .vtf, both numbers with
// two digits. The files of l4d2-zone-server-assets are version 2.
// patent_icon_version "2"

// Highest patent level that has a sprite file (1 or more).
// patent_icon_max_level "15"

// -----------------------------------------------------------------------------
// l4d2_gameinfo_sync.smx - live match, site chat and remote commands
// -----------------------------------------------------------------------------

// 1 = say in chat when a player connects from the same IP address as another
// account seen before. 0 = only print it in the console.
// gameinfo_related_accounts_chat "1"

// Fewest survivors a boomer must vomit on for the event to reach the site
// (1 or more).
// gameinfo_boomer_vomit_min_survivors "3"

// -----------------------------------------------------------------------------
// l4d2_weapon_skins.smx - weapon skins bought in the site shop
// -----------------------------------------------------------------------------

// 1 = apply the skins. 0 = off. Turn it on only after the skin models and
// materials are on the server and on your FastDL (see the plugins guide).
// weapon_skins_enabled "0"

// 1 = kick players whose game refuses to download the server files
// (cl_allowdownload 0, or cl_downloadfilter other than all or nosounds), so
// everyone sees the same skins. 0 = let them play; while one of them is on the
// server, skins stay off for everyone in third person.
// weapon_skins_kick_no_downloads "0"

// Radius, in game units, used to find primary weapons dropped close to each
// other (0 or more).
// weapon_skins_pile_radius "120.0"

// Most dropped primary weapons kept inside that radius; the oldest ones are
// removed. 0 = never remove them.
// weapon_skins_pile_max "3"

// Test mode, for setting the skins up: 1 = every skin is downloaded from the
// next map on, and root admins can use any of them without buying it and
// outside the ready-up. Keep 0 on a public server.
// weapon_skins_preview_all "0"
